version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/storage/schema.sql"
    queries: "internal/storage/query"
    gen:
      go:
        package: "db"
        out: "internal/storage/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        sql_package: "database/sql"
