name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Test bind-mounted share notifications
        run: |
          set -eu
          tmp=$(mktemp -d)
          image="oto-share-watch-test:${GITHUB_RUN_ID}"
          cid=
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          mkdir -p "$tmp/share/.tmp"
          CGO_ENABLED=0 go test -c -o "$tmp/daemon.test" ./internal/daemon
          cat >"$tmp/Dockerfile" <<'EOF'
          FROM scratch
          COPY daemon.test /daemon.test
          ENTRYPOINT ["/daemon.test", "-test.run", "^TestBindMountedShareWatcher$", "-test.v"]
          EOF
          docker build -q -t "$image" "$tmp"
          cid=$(docker run -d -e OTO_SHARE_WATCH_ROOT=/share -e TMPDIR=/share/.tmp -v "$tmp/share:/share" "$image")
          for _ in $(seq 1 100); do
            [ -f "$tmp/share/.oto-watch-ready" ] && break
            sleep 0.1
          done
          [ -f "$tmp/share/.oto-watch-ready" ] || { docker logs "$cid"; exit 1; }
          printf 'host-side-fsnotify\n' >"$tmp/share/host-created.flac"
          status=$(docker wait "$cid")
          docker logs "$cid"
          [ "$status" = 0 ]

  soulfind:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      soulfind:
        image: ghcr.io/soulfind-dev/soulfind@sha256:714f9eb97793bdd3b88ebebe2bc6a63d7dbf343f93da7f09d3de95a456efb910
        ports:
          - 2242:2242
      slskd:
        image: slskd/slskd@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
        env:
          SLSKD_NO_AUTH: "true"
          SLSKD_SLSK_ADDRESS: soulfind
          SLSKD_SLSK_PORT: 2242
          SLSKD_SLSK_USERNAME: slskdpeer
          SLSKD_SLSK_PASSWORD: pw
          SLSKD_SLSK_LISTEN_IP_ADDRESS: 0.0.0.0
          SLSKD_SLSK_LISTEN_PORT: 50300
        ports:
          - 5030:5030
          - 50300:50300
        volumes:
          - /tmp/oto-slskd:/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - name: Test Soulfind integration
        env:
          OTO_SOULFIND_ADDR: 127.0.0.1:2242
          OTO_SLSKD_API: http://127.0.0.1:5030
          OTO_SLSKD_USERNAME: slskdpeer
          OTO_SLSKD_DOWNLOAD_DIR: /tmp/oto-slskd/downloads
        run: go test -count=1 -run '^TestSoulfind' -v ./internal/soulseek ./internal/daemon ./internal/ipc

  audio-and-static-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true
      - name: Install real audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test real fixtures, caching, publication, and missing ffprobe
        run: go test -count=1 -run 'TestRealAudioMetadata|TestAudioProbe' -v ./internal/soulseek
      - name: Build without CGO for amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o "$RUNNER_TEMP/oto-$arch" ./cmd/oto
          done
      - name: Verify runtime image includes ffprobe
        run: |
          docker build -t oto-audio-test .
          docker run --rm --entrypoint ffprobe oto-audio-test -version
